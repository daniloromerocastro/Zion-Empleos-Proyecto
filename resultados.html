<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Empleos | Zion Empleos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans">
    
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="font-extrabold text-xl text-white">ZION <span class="text-amber-500">EMPLEOS</span></a>
            <div class="flex items-center space-x-3 text-sm font-semibold">
                <a href="registro.html" id="btn-login-header" class="px-4 py-2 rounded-xl text-slate-300 bg-slate-800 border border-slate-700 hover:text-white">Iniciar Sesión</a>
                <button onclick="irAMiPanel()" id="btn-panel-header" class="hidden px-4 py-2 rounded-xl text-slate-900 bg-amber-500 hover:bg-amber-400">Mi Perfil</button>
                <button onclick="cerrarSesion()" id="btn-logout-header" class="hidden px-4 py-2 rounded-xl text-white bg-rose-600 hover:bg-rose-700">Salir</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Encabezado de resultados -->
        <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white mb-1">Explorar Ofertas de Trabajo</h1>
                <p class="text-sm text-slate-400" id="contador-resultados">Cargando vacantes...</p>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input type="text" id="filtro-keyword" oninput="aplicarFiltros()" placeholder="Filtrar por cargo..." class="w-full md:w-64 px-4 py-2 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white focus:ring-2 focus:ring-amber-500">
                <button onclick="limpiarFiltros()" class="px-4 py-2 bg-slate-800 text-slate-300 text-sm font-semibold rounded-xl hover:bg-slate-700">Limpiar</button>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-6">
            <!-- Filtros Laterales -->
            <aside class="w-full lg:w-1/4">
                <form id="form-filtros" onsubmit="aplicarFiltros(event)" class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-lg sticky top-24 space-y-5 text-sm">
                    <div class="bg-amber-500/10 border border-amber-500/20 p-2.5 rounded-lg text-[11px] text-amber-200 mb-2">
                        <strong>Filtros Laterales:</strong> Refinan en tiempo real por experiencia, sector laboral, modalidad y tipo de contrato.
                    </div>

                    <div>
                        <label class="block font-bold text-slate-300 mb-2 text-xs uppercase">Ubicación</label>
                        <select id="filtro-ubicacion" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="">Todas las ciudades</option>
                            <option value="San Salvador">San Salvador</option>
                            <option value="Santa Ana">Santa Ana</option>
                            <option value="Remoto Regional">Remoto</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-2 text-xs uppercase">Sector Laboral</label>
                        <select id="filtro-sector" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="">Todos los sectores</option>
                            <option value="Tecnología y Software">Tecnología y Software</option>
                            <option value="Banca y Finanzas">Banca y Finanzas</option>
                            <option value="Diseño y Creatividad">Diseño y Creatividad</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-2 text-xs uppercase">Nivel de Experiencia</label>
                        <div class="space-y-2 text-xs text-slate-300">
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="filtro-exp" value="" checked onchange="aplicarFiltros()" class="accent-amber-500"> <span>Todos los niveles</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="filtro-exp" value="Junior (0-2 años)" onchange="aplicarFiltros()" class="accent-amber-500"> <span>Junior (0-2 años)</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="filtro-exp" value="Mid-Level (2-4 años)" onchange="aplicarFiltros()" class="accent-amber-500"> <span>Mid-Level (2-4 años)</span></label>
                            <label class="flex items-center space-x-2 cursor-pointer"><input type="radio" name="filtro-exp" value="Senior (5+ años)" onchange="aplicarFiltros()" class="accent-amber-500"> <span>Senior (5+ años)</span></label>
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-2 text-xs uppercase">Modalidad</label>
                        <select id="filtro-modalidad" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="">Todas</option>
                            <option value="Presencial">Presencial</option>
                            <option value="Remoto">Remoto</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-1 text-xs uppercase">Salario Mínimo</label>
                        <input type="range" id="filtro-salario" min="0" max="3000" step="100" value="0" oninput="document.getElementById('sal-val').innerText = '$' + this.value; aplicarFiltros()" class="w-full accent-amber-500">
                        <div class="text-right text-xs font-bold text-amber-500 mt-1" id="sal-val">$0</div>
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-slate-800 text-amber-500 font-bold rounded-xl hover:bg-slate-700 border border-slate-700">Aplicar Filtros</button>
                </form>
            </aside>

            <!-- Resultados -->
            <div class="w-full lg:w-3/4">
                <div id="contenedor-empleos" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/busqueda.js"></script>
    <script>
        function irAMiPanel() {
            const rol = localStorage.getItem('usuario_rol');
            if (rol === 'empresa') window.location.href = 'empresa.html';
            else if (rol === 'admin') window.location.href = 'admin.html';
            else window.location.href = 'usuario.html';
        }
        document.addEventListener('DOMContentLoaded', () => renderizarEmpleos());
    </script>
</body>
</html>
