<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Habilidades | Zion Empleos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans">
    <header class="bg-slate-900 border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="usuario.html" class="font-extrabold text-xl text-white"><i class="fa-solid fa-arrow-left mr-2 text-sm text-amber-500"></i> Volver al Panel</a>
            <button onclick="cerrarSesion()" class="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700">Cerrar Sesión</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10 flex-grow w-full grid grid-cols-1 md:grid-cols-2 gap-8">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl h-fit">
            <h1 class="text-xl font-bold text-white mb-6">Añadir Habilidad</h1>
            <form id="form-skill" onsubmit="agregarHabilidad(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Nombre de la Habilidad</label>
                    <input type="text" id="skill-nombre" required class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">Nivel (1 al 100%)</label>
                    <input type="number" id="skill-nivel" min="1" max="100" required class="w-full px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white focus:ring-2 focus:ring-amber-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full py-2.5 bg-amber-500 text-slate-900 font-bold rounded-xl hover:bg-amber-400 transition">Añadir</button>
            </form>
        </div>

        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl">
            <h2 class="text-xl font-bold text-white mb-6">Mis Competencias</h2>
            <div id="lista-habilidades"></div>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/candidato.js"></script>
    <script>
        protegerRutaCandidato();
        document.addEventListener('DOMContentLoaded', renderizarHabilidades);
    </script>
</body>
</html>
