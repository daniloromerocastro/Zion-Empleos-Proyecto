<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi CV | Zion Empleos</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans">
    <header id="site-header" class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="usuario.html" data-nav-role="candidato" class="font-extrabold text-xl text-white"><i class="fa-solid fa-arrow-left mr-2 text-sm text-amber-500"></i> Volver al Panel</a>
            <nav id="site-navigation" aria-label="Navegación principal" class="hidden lg:flex items-center space-x-2 text-sm font-semibold"></nav>
            <div id="session-actions" class="flex items-center space-x-3"></div>
        </div>
    </header>

    <main data-rol-permitido="candidato" class="max-w-3xl mx-auto px-4 py-10 flex-grow w-full">
        <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-xl">
            <h1 class="text-2xl font-bold text-white mb-2">Gestión de Currículum</h1>
            <p class="text-sm text-slate-400 mb-8">Selecciona un PDF. Esta versión solo guarda el nombre localmente; el backend aún no tiene carga de archivos.</p>

            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-2xl mb-6 flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-bold uppercase">Archivo Actual</p>
                    <p class="font-bold text-amber-500" id="cv-actual-text">Cargando...</p>
                </div>
                <i class="fa-solid fa-file-pdf text-3xl text-slate-600"></i>
            </div>

            <form id="form-cv" class="space-y-6">
                <div class="border-2 border-dashed border-slate-700 rounded-2xl p-8 text-center hover:bg-slate-800/30 transition">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-500 mb-3"></i>
                    <p class="text-sm text-slate-400 font-medium mb-2">Haz clic o arrastra tu archivo aquí</p>
                    <input type="file" id="cv-file" accept=".pdf,application/pdf" class="block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-slate-800 file:text-amber-500 hover:file:bg-slate-700 cursor-pointer"/>
                </div>
                <button type="submit" class="w-full py-3 bg-amber-500 text-slate-900 font-bold rounded-xl hover:bg-amber-400 transition">Guardar Currículum</button>
            </form>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/candidato.js"></script>
    <script src="js/global.js"></script>
</body>
</html>
